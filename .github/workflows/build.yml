name: Build

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless Qt runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyside6-essentials
      - name: Run tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyside6-essentials
      - name: Build (onedir, PySide6 + apps.json bundled)
        run: python -m PyInstaller --noconfirm --clean Kiosk.spec
      - name: Stage deploy folder
        shell: pwsh
        run: |
          Copy-Item apps.json            dist\Kiosk\apps.json          -Force
          Copy-Item README.md            dist\Kiosk\README.md          -Force
          Copy-Item CHANGELOG.md         dist\Kiosk\CHANGELOG.md       -Force
          Copy-Item LICENSE              dist\Kiosk\LICENSE            -Force
          Copy-Item install.bat          dist\Kiosk\install.bat        -Force
          Copy-Item kiosk-watchdog.bat   dist\Kiosk\kiosk-watchdog.bat -Force
          Copy-Item kiosk-shell.bat      dist\Kiosk\kiosk-shell.bat    -Force
          Copy-Item diagnose-windows.ps1 dist\Kiosk\diagnose-windows.ps1 -Force
          Get-ChildItem dist\Kiosk | Select-Object Name
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\Kiosk\* -DestinationPath Kiosk-windows.zip -Force
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kiosk-windows
          path: Kiosk-windows.zip
          if-no-files-found: error
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Kiosk-windows.zip
          generate_release_notes: true
